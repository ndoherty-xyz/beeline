<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>beeline</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 220px; margin: 12px; }
      label { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
      #trace-count { color: #666; margin: 12px 0 8px; }
      fieldset { border: none; margin: 0 0 8px; padding: 0 0 0 22px; }
      fieldset:disabled { opacity: 0.5; }
      #overlay-threshold { width: 4em; }
    </style>
  </head>
  <body>
    <label><input type="checkbox" id="prefetch" /> Prefetch on <span id="prefetch-site"></span></label>
    <label><input type="checkbox" id="overlay" /> Show predictions</label>
    <fieldset id="overlay-options">
      <label>
        Predictor
        <select id="overlay-predictor">
          <option value="model">Model</option>
          <option value="foresight">Foresight</option>
        </select>
      </label>
      <label>
        Show
        <select id="overlay-targets">
          <option value="firing">Firing targets only</option>
          <option value="all">All targets</option>
        </select>
      </label>
      <label>Fire at <input type="number" id="overlay-threshold" min="1" max="99" step="1" /> %</label>
    </fieldset>
    <label><input type="checkbox" id="recording" /> Record clicks</label>
    <label>
      Device
      <select id="device">
        <option value="mouse">Mouse</option>
        <option value="trackpad">Trackpad</option>
      </select>
    </label>
    <p id="trace-count"></p>
    <button id="export">Export</button>
    <button id="clear">Clear</button>
    <script src="popup.js"></script>
  </body>
</html>
