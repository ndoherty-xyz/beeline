<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>beeline playground</title>
    <style>
      :root { color-scheme: light dark; --accent: #f59e0b; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 1100px; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin: 32px 0 12px; }
      p { margin: 0; opacity: 0.7; }
      #stats { position: sticky; top: 0; padding: 8px 0; background: Canvas; font: 12px ui-monospace, Menlo, monospace; z-index: 1; }

      /* Cards: CSS only, from --beeline-p. */
      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
      .card {
        display: block; height: 110px; padding: 14px; border-radius: 10px; color: inherit; text-decoration: none;
        border: 2px solid color-mix(in srgb, var(--accent) calc(var(--beeline-p, 0) * 100%), #8884);
        transform: translateY(calc(var(--beeline-p, 0) * -6px));
        transition: transform 80ms, border-color 80ms;
      }

      /* Links: a callback writes the percentage. */
      .links { columns: 3; padding: 0; list-style: none; }
      .links li { padding: 3px 0; }
      .links output { font: 11px ui-monospace, Menlo, monospace; opacity: 0.6; margin-left: 6px; }

      /* Toolbar: `when` adds .hot above 50% and removes it below 30%. */
      .toolbar { display: flex; flex-wrap: wrap; gap: 4px; }
      .toolbar button { width: 34px; height: 30px; border-radius: 6px; border: 1px solid #8886; background: none; color: inherit; }
      .toolbar button.hot { background: var(--accent); color: #1c1917; }
      #once.fired { background: var(--accent); color: #1c1917; }

      .many { display: grid; grid-template-columns: repeat(auto-fill, 40px); gap: 4px; margin-top: 12px; }
      .many button { height: 24px; font-size: 10px; }
    </style>
  </head>
  <body>
    <h1>beeline playground</h1>
    <p>Each element's chance of being clicked in the next 650 ms, from how the cursor moves. Use a mouse or trackpad.</p>
    <div id="stats"></div>

    <h2>Cards: <code>--beeline-p</code> in CSS</h2>
    <div class="cards" id="cards"></div>

    <h2>Links: <code>watch</code></h2>
    <ul class="links" id="links"></ul>

    <h2>Toolbar: <code>when</code> above 0.5, below 0.3</h2>
    <div class="toolbar" id="toolbar"></div>
    <p style="margin-top: 12px"><button id="once">once</button> fires its enter action one time only.</p>

    <h2>Benchmark</h2>
    <button id="add-targets">Add 200 targets</button>
    <div class="many" id="many"></div>

    <script src="dist/playground.js"></script>
  </body>
</html>
